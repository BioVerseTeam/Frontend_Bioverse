<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kết quả Thanh toán - BioVerse</title>
  <meta name="description" content="Trạng thái giao dịch thanh toán gói cước BioVerse qua cổng PayOS">
  <link rel="stylesheet" href="/src/sketchbook.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@600;700;800;900&family=Be+Vietnam+Pro:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <style>
    @layer base { html, body { margin: 0; padding: 0; } }
  </style>
  <script src="https://cdn.tailwindcss.com"></script>
  <script id="tailwind-config">
    tailwind.config = {darkMode:"class",theme:{extend:{"colors":{"on-primary":"#ffffff","on-surface":"#1b1c1c","primary-container":"#db3237","primary":"#b71422","on-surface-variant":"#5b403e","tertiary":"#006a3b"},"fontFamily":{"headline-sm":["Epilogue"],"body-md":["Be Vietnam Pro"],"label-md":["Space Grotesk"],"label-sm":["Space Grotesk"]}}}};
  </script>
</head>
<body class="sketch-paper font-body-md text-body-md text-on-surface min-h-screen flex flex-col justify-between">
  <!-- Top Navigation -->
  <header class="fixed top-0 left-0 right-0 z-50 bg-[#fdfbf7]/95 border-b-[2.5px] border-[#2d2d2d]">
    <div class="h-20 w-full px-4 md:px-8 flex items-center justify-between">
      <a class="flex items-center gap-2 group" href="/">
        <div class="w-10 h-10 rounded-lg bg-primary-container border-2 border-[#2d2d2d] sketch-shadow-sm flex items-center justify-center transform -rotate-2 group-hover:rotate-0 transition-transform">
          <span class="material-symbols-outlined text-on-primary text-[24px]">view_in_ar</span>
        </div>
        <div class="flex flex-col">
          <span class="font-['Epilogue'] text-xl font-black tracking-tight text-primary uppercase">BioVerse</span>
          <span class="font-['Space_Grotesk'] text-xs text-on-surface-variant font-bold tracking-wide">Thanh toán PayOS</span>
        </div>
      </a>
      <a href="/pricing" id="back-to-pricing-btn" class="neo-btn neo-btn-secondary rounded-xl px-4 py-2 text-xs font-bold flex items-center gap-1.5">
        <span class="material-symbols-outlined text-[16px]">arrow_back</span>
        Xem gói cước
      </a>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-1 w-full pt-32 pb-16 px-4 md:px-8 flex items-center justify-center">
    <div class="w-full max-w-lg">
      <div id="checkout-card" class="bg-white border-[2.5px] border-[#2d2d2d] rounded-2xl p-6 md:p-8 sketch-shadow flex flex-col items-center text-center">
        <!-- Spinner placeholder -->
        <span class="material-symbols-outlined text-[48px] animate-spin text-primary mb-4">progress_activity</span>
        <h1 class="font-['Epilogue'] text-2xl font-bold text-[#1b1c1c] mb-2">Đang kiểm tra giao dịch...</h1>
        <p class="font-['Be_Vietnam_Pro'] text-sm text-[#5b403e]">
          Hệ thống đang đồng bộ kết quả từ cổng thanh toán PayOS. Vui lòng đợi trong giây lát.
        </p>
      </div>
    </div>
  </main>

  <footer class="border-t-2 border-[#2d2d2d] bg-[#f9f7f2] py-6 px-4 text-center text-xs text-[#5b403e]">
    <p>© 2026 BioVerse Platform. Tích hợp cổng thanh toán trực tuyến PayOS & VietQR.</p>
  </footer>

  <script type="module" src="/src/pages/checkout.js"></script>
</body>
</html>
