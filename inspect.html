<!DOCTYPE html>
<html>
<head><title>GLB Inspector</title></head>
<body>
<pre id="output" style="font-size:14px; padding:20px; background:#111; color:#0f0;">Loading GLB...</pre>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const loader = new GLTFLoader();
loader.load('/vhm_skull_0-custom.glb', (gltf) => {
  let output = '=== GLB Scene Hierarchy ===\n\n';
  
  function traverse(obj, depth = 0) {
    const indent = '  '.repeat(depth);
    const type = obj.type;
    const meshInfo = obj.isMesh ? ` [Mesh: vertices=${obj.geometry?.attributes?.position?.count || '?'}]` : '';
    const matInfo = obj.material ? ` (material: ${obj.material.name || 'unnamed'})` : '';
    output += `${indent}- ${obj.name || '(unnamed)'} (${type})${meshInfo}${matInfo}\n`;
    
    if (obj.children) {
      obj.children.forEach(child => traverse(child, depth + 1));
    }
  }
  
  traverse(gltf.scene);
  
  output += '\n=== All Mesh Names ===\n';
  gltf.scene.traverse((obj) => {
    if (obj.isMesh) {
      output += `  Mesh: "${obj.name}" | Material: "${obj.material?.name || 'unnamed'}" | Vertices: ${obj.geometry?.attributes?.position?.count || '?'}\n`;
      
      // Compute bounding box
      obj.geometry.computeBoundingBox();
      const bb = obj.geometry.boundingBox;
      output += `  BoundingBox: min(${bb.min.x.toFixed(3)}, ${bb.min.y.toFixed(3)}, ${bb.min.z.toFixed(3)}) max(${bb.max.x.toFixed(3)}, ${bb.max.y.toFixed(3)}, ${bb.max.z.toFixed(3)})\n`;
      
      // Center
      const center = new THREE.Vector3();
      bb.getCenter(center);
      output += `  Center: (${center.x.toFixed(3)}, ${center.y.toFixed(3)}, ${center.z.toFixed(3)})\n`;
      
      // Size
      const size = new THREE.Vector3();
      bb.getSize(size);
      output += `  Size: (${size.x.toFixed(3)}, ${size.y.toFixed(3)}, ${size.z.toFixed(3)})\n`;
      
      // World matrix
      obj.updateWorldMatrix(true, false);
      const worldPos = new THREE.Vector3();
      obj.getWorldPosition(worldPos);
      output += `  WorldPosition: (${worldPos.x.toFixed(3)}, ${worldPos.y.toFixed(3)}, ${worldPos.z.toFixed(3)})\n`;
      
      const worldScale = new THREE.Vector3();
      obj.getWorldScale(worldScale);
      output += `  WorldScale: (${worldScale.x.toFixed(3)}, ${worldScale.y.toFixed(3)}, ${worldScale.z.toFixed(3)})\n`;
    }
  });
  
  // Also check the scene's overall transform
  output += '\n=== Scene Transform ===\n';
  output += `  Position: (${gltf.scene.position.x.toFixed(3)}, ${gltf.scene.position.y.toFixed(3)}, ${gltf.scene.position.z.toFixed(3)})\n`;
  output += `  Rotation: (${gltf.scene.rotation.x.toFixed(3)}, ${gltf.scene.rotation.y.toFixed(3)}, ${gltf.scene.rotation.z.toFixed(3)})\n`;
  output += `  Scale: (${gltf.scene.scale.x.toFixed(3)}, ${gltf.scene.scale.y.toFixed(3)}, ${gltf.scene.scale.z.toFixed(3)})\n`;
  
  document.getElementById('output').textContent = output;
  console.log(output);
}, undefined, (error) => {
  document.getElementById('output').textContent = 'Error: ' + error.message;
});
</script>
</body>
</html>
